
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pedra, Papel e Tesoura</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>✊ Pedra, Papel e Tesoura</h1>
      <p>Escolha sua jogada e desafie o computador!</p>
    </header>

    <section class="jogo" aria-label="Escolha sua jogada">
      <h2>Faça sua escolha</h2>

      <div class="botoes">
        <button class="jogada" data-jogada="Pedra">
          ✊ Pedra
        </button>

        <button class="jogada" data-jogada="Papel">
          ✋ Papel
        </button>

        <button class="jogada" data-jogada="Tesoura">
          ✌️ Tesoura
        </button>
      </div>
    </section>

    <section id="resultado">
      <h2>Escolha uma opção</h2>
      <p>O resultado da partida aparecerá aqui.</p>
    </section>
  </main>
</body>
</html>
